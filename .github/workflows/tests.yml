name: Tests

# Level 1 (unit tests) only — see TESTING.md. No Google, OneMap,
# or OpenClaw credentials exist in this environment, and none of these
# steps need them: every test mocks its external dependency.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile-check src
        run: python -m compileall src

      - name: Run unit tests
        run: pytest -v
